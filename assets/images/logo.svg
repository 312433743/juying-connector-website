<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <!-- 金色渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="50%" style="stop-color:#E8D5A3"/>
      <stop offset="100%" style="stop-color:#B8944F"/>
    </linearGradient>
    <!-- 金色发光效果 -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LOGO图标 - 基于原LOGO的科技感重构 -->
  <g transform="translate(8, 8)">
    <!-- 外圆环 -->
    <circle cx="22" cy="22" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <!-- 内圆环 -->
    <circle cx="22" cy="22" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
    <!-- 三条弧线 - 代表连接与传输 -->
    <path d="M 22 2 A 20 20 0 0 1 38 14" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 22 8 A 14 14 0 0 1 32 16" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 10 18 A 14 14 0 0 0 22 36" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- 中心点 - 代表精密核心 -->
    <circle cx="22" cy="22" r="3" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
    <!-- 连接点 -->
    <circle cx="22" cy="2" r="2" fill="url(#goldGrad)"/>
    <circle cx="38" cy="14" r="2" fill="url(#goldGrad)"/>
    <circle cx="22" cy="36" r="2" fill="url(#goldGrad)"/>
  </g>

  <!-- 中文品牌名 -->
  <text x="56" y="28" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">前海聚英</text>

  <!-- 英文品牌名 -->
  <text x="56" y="46" font-family="'Inter', 'Arial', sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" letter-spacing="3">QIANHAI JOYING</text>

  <!-- 装饰线 -->
  <line x1="56" y1="52" x2="180" y2="52" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>
</svg>