<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="50%" style="stop-color:#E8D5A3"/>
      <stop offset="100%" style="stop-color:#B8944F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="64" height="64" rx="12" fill="#1A1A1A"/>
  <!-- 外圆环 -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
  <!-- 三条弧线 -->
  <path d="M 32 8 A 24 24 0 0 1 52 20" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 32 14 A 18 18 0 0 1 46 24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 18 26 A 18 18 0 0 0 32 50" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- 中心点 -->
  <circle cx="32" cy="32" r="4" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- 连接点 -->
  <circle cx="32" cy="8" r="3" fill="url(#goldGrad)"/>
  <circle cx="52" cy="20" r="3" fill="url(#goldGrad)"/>
  <circle cx="32" cy="50" r="3" fill="url(#goldGrad)"/>
</svg>